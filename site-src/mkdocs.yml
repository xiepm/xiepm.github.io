site_name: Xpm's Robot Lab
site_description: Xpm 的个人项目与学习网站
site_author: Xpm
site_url: https://xpmrobot.cn/
use_directory_urls: true

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.highlight
    - search.share

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
  - javascripts/mathjax.js

nav:
  - 首页: index.md
  - 项目:
      - 项目总览: projects/index.md
      - 设计与项目总览: projects/design-overview.md
      - 开源项目推荐: projects/open-source.md
  - 学习:
      - 学习总览: study/index.md
      - 机器人: study/robotics.md
      - ROS: study/ros.md
      - AI: study/ai.md
      - 编程: study/programming.md
      - 工具: study/tools.md
  - 留言:
      - 留言入口: message/index.md
      - 友链交流: message/links.md
  - 关于:
      - 个人介绍: about/index.md
      - 关于 Xpm: about/xpm.md
